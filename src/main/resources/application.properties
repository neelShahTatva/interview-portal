spring.application.name=interview-portal
jwt.secret=${JWT_SECRET}

# ACTIVE PROFILE (default: dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SWAGGER CONFIGURATION
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.show-actuator=false

app.openapi.dev-url=${DEV_SERVER_URL:http://localhost:8080}
app.openapi.dev-description=Local Development Server

spring.datasource.url=jdbc:postgresql://localhost:5432/interview_portal
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# FILE UPLOAD
server.tomcat.max-part-count=20
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# GEMINI AI
ai.provider.active=gemini
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=

# Groq API
groq.api.key=${GROQ_API_KEY}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.3-70b-versatile

# MAIL
spring.mail.host=mail.etatvasoft.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# FILE PATHS
bulk.question.template.path=static/templates/Bulk_Questions_Template.xlsx

# PROFILE PICTURE UPLOAD
app.upload.dir=D:/interview-portal/uploads/profile-pictures